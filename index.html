<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MY CHARACTER CARDS</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#332b40;background:#faf9ff}*{box-sizing:border-box}body{margin:0}header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #eae3f2}h1{font-size:17px;margin:0;letter-spacing:.08em}h2{font-size:20px;margin:0 0 14px}h3{font-size:15px;margin:10px 0}.sub,small{color:#857792;font-size:12px}.pill{background:#f1e9fb;border-radius:30px;padding:9px 12px;font-size:12px}main{max-width:760px;margin:auto;padding:20px 16px 110px}.panel{background:#fff;border:1px solid #e7dff0;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #493c5b08}.soft{background:#f3eef9}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:#9576be;color:white;padding:11px 14px;font-weight:600}button.secondary{background:#f0e9f7;color:#6d548c}button.danger{background:#fff0f0;color:#a74454}button:disabled{opacity:.4;cursor:default}input,select,textarea{width:100%;border:1px solid #dcd0e9;border-radius:10px;padding:11px;background:white;color:#332b40;margin:5px 0 12px}textarea{min-height:70px;resize:vertical}label{font-size:12px;font-weight:600;color:#71617f;display:block}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:1;white-space:nowrap;background:#f0e9f7;color:#6e5984;font-size:12px;padding:10px 8px}.tabs button.active{background:#9576be;color:white}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8def0;display:flex;justify-content:center;padding:9px 6px max(9px,env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:#867693;flex:1;max-width:130px;font-size:11px;padding:7px 2px}nav button.active{color:#8057b0;background:#f4eff9}.card{border:5px solid var(--border,#bfa7df);background:white;border-radius:15px;overflow:hidden;aspect-ratio:5/7;position:relative;box-shadow:0 4px 14px #3c285024;display:flex;flex-direction:column}.card .top{padding:8px;font-size:10px;display:flex;justify-content:space-between;color:#66537e;font-weight:700}.photo{flex:1;min-height:0;position:relative;background:linear-gradient(130deg,#e5d6f1,#f8f2fb);overflow:hidden}.photo img{position:absolute;width:100%;height:100%;object-fit:cover;left:0;top:0}.photo .placeholder{height:100%;display:grid;place-items:center;color:#9881af;font-size:34px}.card .foot{padding:9px;color:#3b3048}.card .foot strong{font-size:14px}.card .foot small{display:block;margin-top:3px}.card .shine{pointer-events:none;position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#ffffff5c 48%,transparent 65%);mix-blend-mode:screen}.card.back{padding:12px;display:block}.card.back p{font-size:11px;line-height:1.5;overflow-wrap:anywhere}.card.back strong{font-size:17px}.tile{cursor:pointer}.tile .card{width:100%}.tile .caption{font-size:12px;padding:7px 1px}.tag{color:#8265a5;font-weight:700;font-size:12px}.muted{opacity:.65}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{font-size:12px}.preview{max-width:260px;margin:0 auto 14px}.hidden{display:none!important}.notice{font-size:12px;color:#786b83;line-height:1.7}.progress{height:9px;background:#e9e0f1;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#a48aca}.result{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.three{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><div><h1>MY CHARACTER CARDS</h1><div class="sub">Lavender Collection · Prototype 1.5</div></div><div class="pill" id="pointLabel">3,000 PT</div></header><main id="app"></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ranks=['N','R','SR','SSR','UR'],rates={N:40,R:30,SR:20,SSR:8,UR:2},frames={N:'#aeb1ba',R:'#8bb5dc',SR:'#b19bd8',SSR:'#d8b36c',UR:'#b77bdc'};
let db,state={characters:[],cards:[],history:[],points:3000},page='home',view='character',filter='all',detailId=null,editId=null,flip=false,lastPull=[];
const uuid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function init(){db=await new Promise((res,rej)=>{let r=indexedDB.open('my-character-cards-v1',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('app');d.createObjectStore('images')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});state=await req(tx('app').get('state'))||state;render()}
async function save(){await req(tx('app','readwrite').put(state,'state'));render()}
async function saveImage(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('画像ファイルを選択してください');let id=uuid();await req(tx('images','readwrite').put(file,id));return id}
const urls=new Map();async function imageUrl(id){if(!id)return '';if(urls.has(id))return urls.get(id);let blob=await req(tx('images').get(id));if(!blob)return '';let url=URL.createObjectURL(blob);urls.set(id,url);return url}
async function hydrate(){for(const img of document.querySelectorAll('[data-img]')){const id=img.dataset.img;if(id){let url=await imageUrl(id);if(img.isConnected&&url)img.src=url}}}
function character(id){return state.characters.find(x=>x.id===id)||{name:'削除された人物'}}
function cardHtml(c,back=false){let ch=character(c.characterId),b=frames[c.rarity]||frames.N;return `<div class="card ${back?'back':''}" style="--border:${b}">${back?`<div class="tag">CHARACTER PROFILE</div><br><strong>${esc(ch.name)}</strong><p>年齢：${esc(ch.age||'未設定')}　身長：${esc(ch.height||'未設定')}cm</p><p>職業：${esc(ch.job||'未設定')}</p><p>性格：${esc(ch.personality||'未設定')}</p><p>外見：${esc(ch.appearance||'未設定')}</p><p>人物背景：${esc(ch.background||'未設定')}</p><p>カードストーリー：${esc(c.story||'未設定')}</p>`:`<div class="top"><span>${esc(c.series)}</span><span>${esc(c.rarity)} ✦</span></div><div class="photo">${c.imageId?`<img data-img="${esc(c.imageId)}" style="transform:scale(${Number(c.scale||100)/100}) translate(${Number(c.x||0)}%,${Number(c.y||0)}%)">`:'<div class="placeholder">◇</div>'}</div><div class="foot"><strong>${esc(ch.name)}</strong><small>No. ${esc(c.number)} · ${esc(c.edition||'通常版')}</small></div>${c.foil?'<div class="shine"></div>':''}`}</div>`}
function nav(){const items=[['home','⌂','ホーム'],['catalog','▦','図鑑'],['gacha','✧','ガチャ'],['register','＋','登録'],['settings','⚙','設定']];$('#nav').innerHTML=items.map(([id,icon,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><div style="font-size:21px">${icon}</div>${label}</button>`).join('')}
function go(p){page=p;detailId=null;editId=null;render();scrollTo(0,0)}
function render(){nav();$('#pointLabel').textContent=state.points.toLocaleString()+' PT';const root=$('#app');root.innerHTML=page==='home'?home():page==='catalog'?catalog():page==='gacha'?gacha():page==='register'?register():settings();hydrate()}
function home(){let n=state.cards.filter(c=>c.qty>0).length;return `<h2>あなたのカードコレクション</h2><div class="panel soft"><small>COLLECTION PROGRESS</small><h2 style="margin:10px 0">${n} / ${state.cards.length} 種類</h2><div class="progress"><span style="width:${state.cards.length?100*n/state.cards.length:0}%"></span></div><p class="notice">${state.cards.length?Math.round(n/state.cards.length*100):0}% コンプリート</p></div><div class="grid"><button onclick="go('register')">＋ カードを作る</button><button class="secondary" onclick="go('gacha')">✧ ガチャを引く</button></div><div class="panel"><h3>登録状況</h3><p>キャラクター：${state.characters.length}人</p><p>カード：${state.cards.length}種類</p><p>ガチャ獲得：${state.history.reduce((a,h)=>a+h.results.length,0)}枚</p></div><p class="notice">最初は「登録」からキャラクターを作り、次にカードを追加してください。カードが登録されるとガチャに登場します。</p>`}
function catalog(){if(detailId){let c=state.cards.find(x=>x.id===detailId);if(!c){detailId=null;return catalog()}return `<button class="secondary" onclick="detailId=null;render()">← 図鑑へ</button><div class="preview" style="margin-top:15px" onclick="flip=!flip;render()">${cardHtml(c,flip)}</div><p class="notice" style="text-align:center">カードをタップして表裏を切り替え</p><div class="panel"><h3>${esc(character(c.characterId).name)} · ${esc(c.edition||'通常版')}</h3><p>シリーズ：${esc(c.series)} ／ レアリティ：${esc(c.rarity)}</p><p>所持枚数：${c.qty}枚</p><p>カードストーリー：${esc(c.story||'未設定')}</p><div class="toolbar"><button onclick="editId='${c.id}';page='register';render()">編集</button><button class="secondary" onclick="adjust('${c.id}',1)">＋1枚</button><button class="secondary" onclick="adjust('${c.id}',-1)">−1枚</button><button class="secondary" onclick="toggleFav('${c.id}')">${c.favorite?'♥ お気に入り解除':'♡ お気に入り'}</button><button class="danger" onclick="removeCard('${c.id}')">カード削除</button></div></div>`}
let choices=view==='character'?[...state.characters.map(c=>[c.id,c.name])]:[...new Set(state.cards.map(c=>c.series))].map(s=>[s,s]);let list=state.cards.filter(c=>(filter==='all'||(view==='character'?c.characterId===filter:c.series===filter)));return `<h2>カード図鑑</h2><div class="tabs"><button class="${view==='character'?'active':''}" onclick="view='character';filter='all';render()">キャラクター別</button><button class="${view==='series'?'active':''}" onclick="view='series';filter='all';render()">シリーズ別</button></div><label>表示対象</label><select onchange="filter=this.value;render()"><option value="all">すべて表示</option>${choices.map(([v,n])=>`<option value="${esc(v)}" ${filter===v?'selected':''}>${esc(n)}</option>`).join('')}</select><p class="notice">${list.length}種類 · タップでカード詳細へ</p><div class="grid">${list.map(c=>`<div class="tile" onclick="detailId='${c.id}';flip=false;render()">${c.qty?cardHtml(c):`<div class="card" style="--border:#d5cce0;display:grid;place-items:center;background:#f0ecf4;color:#8e80a0">🔒<br>未獲得</div>`}<div class="caption">${esc(character(c.characterId).name)} · ${esc(c.series)}<br><small>${esc(c.rarity)} · ${c.qty}枚</small></div></div>`).join('')}</div>${!list.length?'<div class="panel">まだカードがありません。登録画面から作成してください。</div>':''}`}
function adjust(id,n){let c=state.cards.find(x=>x.id===id);c.qty=Math.max(0,c.qty+n);save()}
function toggleFav(id){let c=state.cards.find(x=>x.id===id);c.favorite=!c.favorite;save()}
function removeCard(id){if(!confirm('カードを削除しますか？ 過去のガチャ履歴は残ります。'))return;state.cards=state.cards.filter(c=>c.id!==id);detailId=null;save()}
function register(){if(editId)return cardForm(state.cards.find(c=>c.id===editId));return `<h2>キャラクター・カード登録</h2><div class="tabs"><button onclick="document.getElementById('charForm').classList.toggle('hidden')">＋ キャラクター作成</button><button onclick="document.getElementById('cardForm').classList.toggle('hidden')">＋ カード作成</button></div><div class="panel" id="charForm"><h3>キャラクター登録</h3><form onsubmit="createCharacter(event)"><label>名前 *</label><input name="name" required><div class="grid"><div><label>年齢</label><input name="age" type="number" min="18"></div><div><label>身長（cm）</label><input name="height" type="number"></div></div><label>職業</label><input name="job"><label>婚姻状況</label><select name="marital"><option>未設定</option><option>未婚</option><option>既婚</option><option>その他</option></select><label>性格</label><textarea name="personality"></textarea><label>外見・髪型</label><textarea name="appearance"></textarea><label>生活背景・家族構成</label><textarea name="background"></textarea><label>人物ストーリー</label><textarea name="story"></textarea><button type="submit">人物を保存</button></form></div><div class="panel" id="cardForm"><h3>カード作成</h3>${cardFields()}</div><div class="panel"><h3>登録済みキャラクター</h3>${state.characters.map(c=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><span>${esc(c.name)}</span><button class="secondary" onclick="editCharacter('${c.id}')">編集</button></div>`).join('')||'<p class="notice">まだ登録されていません</p>'}</div>`}
function cardFields(c){c=c||{};return `<form onsubmit="createCard(event)"><label>キャラクター *</label><select name="characterId" required>${state.characters.map(ch=>`<option value="${ch.id}" ${ch.id===c.characterId?'selected':''}>${esc(ch.name)}</option>`).join('')}</select>${!state.characters.length?'<p class="notice">先にキャラクターを登録してください。</p>':''}<label>カード用写真 ${c.id?'（変更しない場合はそのまま）':''}</label><input name="photo" type="file" accept="image/*"><label>シリーズ</label><input name="series" value="${esc(c.series||'ORIGINAL')}" required><label>カードの版名</label><input name="edition" value="${esc(c.edition||'通常版')}"><label>レアリティ</label><select name="rarity">${ranks.map(r=>`<option ${r=== (c.rarity||'SR')?'selected':''}>${r}</option>`).join('')}</select><label>カードストーリー</label><textarea name="story">${esc(c.story||'')}</textarea><div class="grid"><div><label>写真拡大率（%）</label><input name="scale" type="number" min="50" max="250" value="${c.scale||100}"></div><div><label>横位置（%）</label><input name="x" type="number" min="-100" max="100" value="${c.x||0}"></div></div><label>縦位置（%）</label><input name="y" type="number" min="-100" max="100" value="${c.y||0}"><label><input type="checkbox" name="foil" style="width:auto" ${c.foil?'checked':''}> 光沢演出</label><label><input type="checkbox" name="inGacha" style="width:auto" ${c.inGacha!==false?'checked':''}> ガチャ対象にする</label><label><input type="checkbox" name="direct" style="width:auto" ${c.qty?'checked':''}> 直接所持する（初回登録時＋1枚）</label><button type="submit" ${!state.characters.length?'disabled':''}>${c.id?'変更を保存':'カードを作成'}</button></form>`}
function cardForm(c){return `<button class="secondary" onclick="editId=null;render()">← 登録画面へ</button><h2 style="margin-top:15px">カード編集</h2><div class="preview">${cardHtml(c)}</div><div class="panel">${cardFields(c)}</div>`}
async function createCharacter(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.characters.push({id:uuid(),...d});await save();alert('キャラクターを登録しました。次にカードを作成できます。')}
async function editCharacter(id){let c=state.characters.find(x=>x.id===id);let keys=[['name','名前'],['age','年齢'],['height','身長'],['job','職業'],['marital','婚姻状況'],['personality','性格'],['appearance','外見'],['background','生活背景'],['story','人物ストーリー']];for(let [k,l] of keys){let v=prompt(l,c[k]||'');if(v===null)return;c[k]=v}await save()}
async function createCard(e){e.preventDefault();try{let f=new FormData(e.target),old=editId?state.cards.find(x=>x.id===editId):null;let imageId=f.get('photo')?.size?await saveImage(f.get('photo')):old?.imageId||null;let c={id:old?.id||uuid(),number:old?.number||String(state.cards.length+1).padStart(3,'0'),characterId:f.get('characterId'),series:f.get('series').trim(),edition:f.get('edition'),rarity:f.get('rarity'),story:f.get('story'),scale:Number(f.get('scale'))||100,x:Number(f.get('x'))||0,y:Number(f.get('y'))||0,foil:f.has('foil'),inGacha:f.has('inGacha'),qty:(old?.qty||0)+(!old&&f.has('direct')?1:0),favorite:old?.favorite||false,imageId};if(old)Object.assign(old,c);else state.cards.push(c);editId=null;await save();page='catalog';detailId=c.id;render()}catch(err){alert('保存できませんでした: '+err.message)}}
function eligible(){return state.cards.filter(c=>c.inGacha&&(gachaSeries==='ALL'||c.series===gachaSeries))}
let gachaSeries='ALL',gachaView='draw';function effective(){let e=eligible(),available=ranks.filter(r=>e.some(c=>c.rarity===r)),sum=available.reduce((a,r)=>a+rates[r],0);return {e,available,sum}}
function gacha(){let {e,available,sum}=effective(),series=[...new Set(state.cards.filter(c=>c.inGacha).map(c=>c.series))];return `<h2>Lavender Gacha</h2><div class="tabs"><button class="${gachaView==='draw'?'active':''}" onclick="gachaView='draw';render()">ガチャ</button><button class="${gachaView==='history'?'active':''}" onclick="gachaView='history';render()">獲得履歴</button></div>${gachaView==='history'?historyHtml():`<div class="panel soft" style="text-align:center;padding:30px 16px"><div style="font-size:54px;color:#9576be">✧</div><h2>LAVENDER PACK</h2><p class="sub">新しいカードとの出会い</p></div><label>ガチャを選ぶ</label><select onchange="gachaSeries=this.value;lastPull=[];render()"><option value="ALL">通常ガチャ（全シリーズ）</option>${series.map(s=>`<option value="${esc(s)}" ${gachaSeries===s?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="grid"><button ${e.length&&state.points>=100?'':'disabled'} onclick="pull(1)">1回 · 100 PT</button><button ${e.length&&state.points>=1000?'':'disabled'} onclick="pull(10)">10連 · 1,000 PT</button></div>${!e.length?'<p class="notice">排出対象カードがありません。カード登録画面でガチャ対象を有効にしてください。</p>':''}<div class="panel"><h3>実効排出確率</h3>${available.slice().reverse().map(r=>`<div class="row"><span>${r}</span><strong>${(rates[r]/sum*100).toFixed(2)}%</strong></div>`).join('<hr style="border:0;border-top:1px solid #eee">')||'<p class="notice">対象なし</p>'}<p class="notice">該当レアリティのカードがない場合、残りのレアリティに確率を比例配分します。同レアリティ内は均等抽選。</p></div>${lastPull.length?`<div class="panel result"><h3>獲得結果</h3><div class="grid three">${lastPull.map(c=>`<div>${cardHtml(c)}<small>${esc(c.rarity)} · ${esc(character(c.characterId).name)}</small></div>`).join('')}</div></div>`:''}`}`;}
function pull(n){let {e,available,sum}=effective();if(!e.length||state.points<n*100)return;let out=[];for(let i=0;i<n;i++){let roll=Math.random()*sum,rank=available.at(-1);for(let r of available){roll-=rates[r];if(roll<0){rank=r;break}}let pool=e.filter(c=>c.rarity===rank);out.push(pool[Math.floor(Math.random()*pool.length)])}let before=new Map(state.cards.map(c=>[c.id,c.qty]));for(let c of out)c.qty++;state.points-=n*100;state.history.unshift({id:uuid(),time:new Date().toISOString(),series:gachaSeries,cost:n*100,rates:Object.fromEntries(available.map(r=>[r,rates[r]/sum*100])),results:out.map((c,i)=>({cardId:c.id,name:character(c.characterId).name,rarity:c.rarity,series:c.series,new:before.get(c.id)===0&&out.findIndex(x=>x.id===c.id)===i}))});lastPull=out;save()}
function historyHtml(){return `<div class="panel"><h3>獲得履歴</h3>${state.history.map(h=>`<div style="border-bottom:1px solid #eee;padding:12px 0"><strong>${new Date(h.time).toLocaleString('ja-JP')}</strong><small> ${esc(h.series)} · ${h.results.length}枚 · ${h.cost}PT</small><p class="notice">${h.results.map(r=>`${esc(r.name)}（${esc(r.rarity)}）${r.new?' NEW':''}`).join('、')}</p></div>`).join('')||'<p class="notice">履歴はまだありません。</p>'}</div>`}
function settings(){return `<h2>設定・バックアップ</h2><div class="panel"><h3>データのバックアップ</h3><p class="notice">画像も含むJSONファイルを書き出します。ファイルが大きくなることがあります。</p><button onclick="backup()">バックアップを保存</button><br><br><label>バックアップから復元（現在のデータを置き換えます）</label><input type="file" accept="application/json,.json" onchange="restore(event)"></div><div class="panel"><h3>ポイント管理</h3><p>残高：${state.points.toLocaleString()} PT</p><button class="secondary" onclick="state.points+=1000;save()">＋1,000 PT（デモ用）</button></div><div class="panel"><h3>仕様について</h3><p class="notice">保存先はこのブラウザのIndexedDBです。ブラウザデータ削除や端末変更で失われる場合があります。定期的にバックアップしてください。ガチャは娯楽用の疑似乱数で、金銭的価値のある抽選には適していません。</p></div>`}
async function backup(){try{let all=await req(tx('images').getAllKeys()),images={};for(let id of all){let b=await req(tx('images').get(id));images[id]=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}let blob=new Blob([JSON.stringify({version:1,state,images})],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-character-cards-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}catch(err){alert('バックアップ失敗: '+err.message)}}
async function restore(ev){let f=ev.target.files[0];if(!f)return;if(!confirm('現在の登録データをバックアップ内容で置き換えます。続けますか？'))return;try{let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.state?.cards)||!Array.isArray(data.state?.characters))throw Error('形式が正しくありません');for(let [id,uri] of Object.entries(data.images||{})){let blob=await(await fetch(uri)).blob();await req(tx('images','readwrite').put(blob,id))}state=data.state;await save();alert('復元しました')}catch(err){alert('復元できませんでした: '+err.message)}}
init().catch(e=>{$('#app').innerHTML='<div class="panel">このブラウザではデータベースを開けませんでした。SafariやChromeの通常モードで開いてください。<br>'+esc(e.message)+'</div>'});
</script></body></html>
